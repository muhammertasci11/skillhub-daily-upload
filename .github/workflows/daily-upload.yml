name: Daily Gumroad Upload

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --ignore-scripts
      - run: node daily-uploader.js ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      - name: Commit progress
        run: |
          git config user.name "skillhub-bot"
          git config user.email "bot@skillhub.com"
          git add upload-progress.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update upload progress" && git push)
